# RemoteFunnel on Linux. Generated settings live in .env (written by ./setup.sh).
#   desktop     - capture/encode/input/audio server, listening on 127.0.0.1:${RD_PORT} on the host
#   cloudflared - (profile "cloudflare") publishes it through your Cloudflare Tunnel
#   tailscale   - (profile "tailscale")  publishes it through Tailscale Funnel
# Enabled profiles come from COMPOSE_PROFILES in .env.
name: remotefunnel

services:
  desktop:
    build: ./server
    image: remotefunnel-desktop
    restart: unless-stopped
    cap_add: [SYS_ADMIN]          # needed to read the KMS framebuffer
    devices:
      - /dev/dri:/dev/dri
      - /dev/uinput:/dev/uinput
    environment:
      RD_TOKEN_SHA256: ${RD_TOKEN_SHA256:?run ./setup.sh first}
      RD_PORT: "8080"          # inside the container; the host port is ${RD_PORT}
      RD_PUBLIC_URLS: ${RD_PUBLIC_URLS:-}
      RD_AUDIO: ${RD_AUDIO:-1}
      PULSE_SERVER: unix:/run/remotefunnel/pulse.sock
    volumes:
      # PipeWire/PulseAudio is told (by setup.sh) to also put a socket here, a path that exists
      # at boot and survives logouts (unlike /run/user/<uid>)
      - ${RD_PULSE_DIR:-./pulse}:/run/remotefunnel
    ports:
      - "127.0.0.1:${RD_PORT:-47913}:8080"

  cloudflared:
    profiles: [cloudflare]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://desktop:8080
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on: [desktop]

  tailscale:
    profiles: [tailscale]
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-remotefunnel}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on: [desktop]
